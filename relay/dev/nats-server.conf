server_name: aegis-relay-local
listen: 0.0.0.0:4222

authorization {
    users: [
        {
            user: aegis-relay
            password: $NATS_AUTH_TOKEN
            permissions: {
                publish: { allow: [
                    "aegis.commands.*"
                    "$JS.API.STREAM.CREATE.AEGIS_COMMANDS"
                    "$JS.API.STREAM.UPDATE.AEGIS_COMMANDS"
                    "$JS.API.STREAM.CREATE.AEGIS_EVENTS"
                    "$JS.API.STREAM.UPDATE.AEGIS_EVENTS"
                    "$JS.API.STREAM.INFO.AEGIS_EVENTS"
                    "$JS.API.CONSUMER.INFO.AEGIS_EVENTS.relay-whatsapp-delivery"
                    "$JS.API.CONSUMER.CREATE.AEGIS_EVENTS.relay-whatsapp-delivery.aegis.events.*"
                    "$JS.API.CONSUMER.MSG.NEXT.AEGIS_EVENTS.relay-whatsapp-delivery"
                    "$JS.ACK.AEGIS_EVENTS.relay-whatsapp-delivery.*.*.*.*.*"
                ] }
                subscribe: { allow: ["_INBOX.aegis.relay.>"] }
            }
        }
        {
            user: $AEGIS_NATS_DEVICE_USERNAME
            password: $AEGIS_NATS_DEVICE_PASSWORD
            permissions: {
                publish: { allow: [
                    $AEGIS_NATS_DEVICE_EVENT_SUBJECT
                    $AEGIS_NATS_DEVICE_CONSUMER_INFO
                    $AEGIS_NATS_DEVICE_CONSUMER_CREATE
                    $AEGIS_NATS_DEVICE_CONSUMER_NEXT
                    $AEGIS_NATS_DEVICE_ACK
                ] }
                subscribe: { allow: [$AEGIS_NATS_DEVICE_INBOX] }
            }
        }
        {
            user: $AEGIS_NATS_DEVICE2_USERNAME
            password: $AEGIS_NATS_DEVICE2_PASSWORD
            permissions: {
                publish: { allow: [
                    $AEGIS_NATS_DEVICE2_EVENT_SUBJECT
                    $AEGIS_NATS_DEVICE2_CONSUMER_INFO
                    $AEGIS_NATS_DEVICE2_CONSUMER_CREATE
                    $AEGIS_NATS_DEVICE2_CONSUMER_NEXT
                    $AEGIS_NATS_DEVICE2_ACK
                ] }
                subscribe: { allow: [$AEGIS_NATS_DEVICE2_INBOX] }
            }
        }
    ]
}

jetstream {
    store_dir: /data/jetstream
}

tls {
    cert_file: /run/certs/nats.crt
    key_file: /run/certs/nats.key
}
