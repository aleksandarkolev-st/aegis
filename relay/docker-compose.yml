services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: aegis_relay
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: local-development-password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    ports:
      - "127.0.0.1:${RELAY_POSTGRES_PORT:-55432}:5432"
    volumes:
      - relay-postgres:/var/lib/postgresql/data
    networks:
      - relay-private
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relay -d aegis_relay"]
      interval: 5s
      timeout: 3s
      retries: 20

  nats:
    image: nats:2-alpine
    command: ["-c", "/etc/nats/nats-server.conf"]
    environment:
      NATS_AUTH_TOKEN: ${NATS_AUTH_TOKEN:?Set the aegis-relay principal password}
      AEGIS_NATS_DEVICE_USERNAME: ${AEGIS_NATS_DEVICE_USERNAME:?Set the first canonical installation principal}
      AEGIS_NATS_DEVICE_PASSWORD: ${AEGIS_NATS_DEVICE_PASSWORD:?Set the first device password}
      AEGIS_NATS_DEVICE_EVENT_SUBJECT: ${AEGIS_NATS_DEVICE_EVENT_SUBJECT:?Set the exact first device event subject}
      AEGIS_NATS_DEVICE_CONSUMER_INFO: ${AEGIS_NATS_DEVICE_CONSUMER_INFO:?Set the exact first device consumer info API}
      AEGIS_NATS_DEVICE_CONSUMER_CREATE: ${AEGIS_NATS_DEVICE_CONSUMER_CREATE:?Set the exact first device filtered create API}
      AEGIS_NATS_DEVICE_CONSUMER_NEXT: ${AEGIS_NATS_DEVICE_CONSUMER_NEXT:?Set the exact first device pull API}
      AEGIS_NATS_DEVICE_ACK: ${AEGIS_NATS_DEVICE_ACK:?Set the exact first device consumer ACK pattern}
      AEGIS_NATS_DEVICE_INBOX: ${AEGIS_NATS_DEVICE_INBOX:?Set the private first device inbox pattern}
      AEGIS_NATS_DEVICE2_USERNAME: ${AEGIS_NATS_DEVICE2_USERNAME:?Set the second canonical installation principal}
      AEGIS_NATS_DEVICE2_PASSWORD: ${AEGIS_NATS_DEVICE2_PASSWORD:?Set the second device password}
      AEGIS_NATS_DEVICE2_EVENT_SUBJECT: ${AEGIS_NATS_DEVICE2_EVENT_SUBJECT:?Set the exact second device event subject}
      AEGIS_NATS_DEVICE2_CONSUMER_INFO: ${AEGIS_NATS_DEVICE2_CONSUMER_INFO:?Set the exact second device consumer info API}
      AEGIS_NATS_DEVICE2_CONSUMER_CREATE: ${AEGIS_NATS_DEVICE2_CONSUMER_CREATE:?Set the exact second device filtered create API}
      AEGIS_NATS_DEVICE2_CONSUMER_NEXT: ${AEGIS_NATS_DEVICE2_CONSUMER_NEXT:?Set the exact second device pull API}
      AEGIS_NATS_DEVICE2_ACK: ${AEGIS_NATS_DEVICE2_ACK:?Set the exact second device consumer ACK pattern}
      AEGIS_NATS_DEVICE2_INBOX: ${AEGIS_NATS_DEVICE2_INBOX:?Set the private second device inbox pattern}
    ports:
      - "127.0.0.1:${RELAY_NATS_PORT:-4422}:4222"
    volumes:
      - ./dev/nats-server.conf:/etc/nats/nats-server.conf:ro
      - ./dev/certs/nats.crt:/run/certs/nats.crt:ro
      - ./dev/certs/nats.key:/run/certs/nats.key:ro
      - relay-jetstream:/data/jetstream
    networks:
      - relay-private
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 4222"]
      interval: 5s
      timeout: 3s
      retries: 20

networks:
  relay-private:
    internal: true

volumes:
  relay-postgres:
  relay-jetstream:
