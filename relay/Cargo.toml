[package]
name = "aegis-relay"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
async-nats = { version = "0.50", default-features = false, features = ["jetstream", "ring"] }
async-trait = "0.1"
axum = { version = "0.8", features = ["macros"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde", "clock"] }
hmac = "0.12"
futures-util = "0.3"
rand = "0.8"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono"] }
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "net", "io-util", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
arun = { path = ".." }
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
