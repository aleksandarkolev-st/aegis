name: Native release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Select Rust toolchain
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup target add ${{ matrix.target }}
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        run: node scripts/release.mjs verify "$GITHUB_REF_NAME"
      - name: Test
        run: |
          cargo test --locked --all-targets
          npm test
      - name: Build native runtime
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Stage binary
        run: node scripts/release.mjs stage ${{ matrix.target }} artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: artifacts/*
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: native
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Check trusted publishing prerequisites
        run: |
          npm install --global 'npm@^11.5.1'
          npm --version
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Verify complete release and package
        run: |
          node scripts/release.mjs verify "$GITHUB_REF_NAME"
          node scripts/release.mjs checksums artifacts
          npm pack --ignore-scripts --pack-destination artifacts
      - name: Publish native assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/* --verify-tag --draft --title "Aegis $GITHUB_REF_NAME" --generate-notes
          gh release edit "$GITHUB_REF_NAME" --draft=false
      - name: Publish package to npm
        if: success()
        run: |
          # npm publish takes a single file, not a glob pattern. Resolve it in
          # the shell first: a quoted pattern is read as a spec and npm tries to
          # fetch it as a git URL.
          mapfile -t tarballs < <(find artifacts -maxdepth 1 -name 'aegis-arun-*.tgz')
          if [ "${#tarballs[@]}" -ne 1 ]; then
            echo "expected exactly one npm tarball, found ${#tarballs[@]}"
            exit 1
          fi
          npm publish "${tarballs[0]}"