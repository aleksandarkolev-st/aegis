[package]
name = "arun"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
fs2 = "0.4"
hex = "0.4"
tempfile = "3"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
