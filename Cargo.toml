[package]
name = "arun"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
crossterm = "0.29"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
dunce = "1"
fs2 = "0.4"
process-wrap = { version = "10.0.1", default-features = false, features = ["std", "job-object", "process-group", "creation-flags"] }
hex = "0.4"
jsonschema = { version = "0.57", default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
tempfile = "3"
tiktoken-rs = "=0.12.1"
rusqlite = { version = "0.37", features = ["bundled"] }
rmcp = { version = "3.4", default-features = false, features = ["client", "transport-child-process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "process", "macros", "time", "io-util", "net"] }
uuid = { version = "1", features = ["v4"] }
unicode-width = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects"] }
