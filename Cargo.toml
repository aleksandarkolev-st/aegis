[package]
name = "arun"
version = "0.2.2"
edition = "2024"

[dependencies]
anyhow = "1"
base64 = "0.22.1"
crossterm = "0.29"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
async-nats = { version = "0.50", default-features = false, features = ["jetstream", "aws-lc-rs"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
futures-util = "0.3"
dunce = "1"
fs2 = "0.4"
process-wrap = { version = "10.0.1", default-features = false, features = ["std", "job-object", "process-group", "creation-flags"] }
hex = "0.4"
jsonschema = { version = "0.57", default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
tempfile = "3"
tiktoken-rs = "=0.12.1"
rusqlite = { version = "0.37", features = ["bundled"] }
rmcp = { version = "3.4", default-features = false, features = ["client", "transport-child-process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "process", "macros", "time", "io-util", "net", "signal"] }
uuid = { version = "1", features = ["v4"] }
unicode-width = "0.2"
unicode-segmentation = "1.13"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Cryptography", "Win32_System_Com", "Win32_System_JobObjects", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Console", "Win32_System_Threading", "Win32_System_IO", "Win32_Storage_FileSystem"] }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Console", "Win32_System_Threading", "Win32_System_Pipes", "Win32_System_IO", "Win32_Storage_FileSystem"] }
