[package]
name = "arun"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
dunce = "1"
fs2 = "0.4"
hex = "0.4"
jsonschema = { version = "0.57", default-features = false }
tempfile = "3"
rusqlite = { version = "0.37", features = ["bundled"] }
rmcp = { version = "3.4", default-features = false, features = ["client", "transport-child-process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "process"] }
uuid = { version = "1", features = ["v4"] }
